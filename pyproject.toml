[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egohtr-prompthmr-eval"
version = "0.1.0"
description = "EgoHTR to PromptHMR single-frame evaluation pipeline"
requires-python = ">=3.10"
dependencies = ["numpy", "PyYAML", "opencv-python", "huggingface_hub", "viser", "scipy"]

[project.scripts]
egohtr-phmr-eval = "egohtr_phmr_eval.cli:main"
egohtr-phmr-fit-gender = "egohtr_phmr_eval.gender_fit:main"

[tool.setuptools.packages.find]
where = ["src"]
